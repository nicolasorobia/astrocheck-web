<!DOCTYPE html>
<html lang="en">
<!--
	BioBeacon web loader. Used by the Web export preset (html/custom_html_shell).
	Replaces Godot's default loading page: a terminal-style "BOOTING_SIMULATION...."
	bar on black. Godot fills in the $GODOT_... placeholders when exporting.
	Progress: 0-90 % = downloading the engine (.wasm) and the game data (.pck),
	90-100 % = starting the engine; the screen fades out once BioBeacon is running.
-->
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	--teal: #4fe3d6;
	--teal-dim: rgba(79, 227, 214, 0.45);
	--red: #ff6b5e;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	background-color: #000;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#boot {
	position: absolute;
	inset: 0;
	z-index: 10;
	display: flex;
	align-items: center;
	justify-content: center;
	background: radial-gradient(ellipse at center, #031414 0%, #000 60%);
	font-family: Consolas, 'Lucida Console', 'Courier New', monospace;
	color: var(--teal);
	transition: opacity 0.8s ease;
}

#boot.done {
	opacity: 0;
	pointer-events: none;
}

#boot-box {
	width: min(560px, 86vw);
}

#boot-line {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	font-size: 22px;
	letter-spacing: 1px;
	margin-bottom: 14px;
	text-shadow: 0 0 8px rgba(79, 227, 214, 0.55);
}

#boot-dots {
	display: inline-block;
	width: 4ch;   /* fixed width so the line doesn't jump as dots appear */
	text-align: left;
}

#boot-bar {
	height: 22px;
	padding: 3px;
	border: 2px solid var(--teal-dim);
	border-radius: 3px;
	box-shadow: 0 0 12px rgba(79, 227, 214, 0.18), inset 0 0 10px rgba(79, 227, 214, 0.08);
}

#boot-fill {
	height: 100%;
	width: 0%;
	/* segmented blocks, like a terminal progress bar */
	background: repeating-linear-gradient(90deg, var(--teal) 0 7px, transparent 7px 10px);
	filter: drop-shadow(0 0 4px rgba(79, 227, 214, 0.7));
}

#boot-notice {
	display: none;
	margin-top: 18px;
	font-size: 16px;
	line-height: 1.4;
	color: var(--red);
	white-space: pre-line;
}

#boot.failed #boot-fill {
	background: repeating-linear-gradient(90deg, var(--red) 0 7px, transparent 7px 10px);
}

#boot.failed #boot-notice {
	display: block;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="boot">
			<div id="boot-box">
				<div id="boot-line">
					<span><span id="boot-text">BOOTING_SIMULATION</span><span id="boot-dots">.</span></span>
					<span id="boot-pct">0%</span>
				</div>
				<div id="boot-bar"><div id="boot-fill"></div></div>
				<div id="boot-notice"></div>
			</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const boot = document.getElementById('boot');
	const text = document.getElementById('boot-text');
	const dots = document.getElementById('boot-dots');
	const pct = document.getElementById('boot-pct');
	const fill = document.getElementById('boot-fill');
	const notice = document.getElementById('boot-notice');

	let target = 0;      // where the bar is heading (0-100)
	let shown = 0;       // what the bar shows (eases towards target)
	let started = false;
	let failed = false;
	const t0 = performance.now();

	function tick() {
		if (failed) {
			return;
		}
		// Animated dots: "." -> "...." and around again.
		dots.textContent = '.'.repeat(1 + Math.floor((performance.now() - t0) / 400) % 4);
		// Download done, engine starting: creep from 90 % towards 99 % until it's running.
		if (!started && target >= 90) {
			target = Math.min(99, target + 0.04);
		}
		shown += (target - shown) * 0.12;
		if (target - shown < 0.05) {
			shown = target;
		}
		fill.style.width = shown.toFixed(2) + '%';
		pct.textContent = Math.floor(shown) + '%';
		if (started && shown >= 100) {
			boot.classList.add('done');
			setTimeout(() => boot.remove(), 900);
			return;
		}
		requestAnimationFrame(tick);
	}

	function fail(err) {
		console.error(err);
		failed = true;
		dots.textContent = '';
		text.textContent = 'BOOT_FAILED';
		let msg = 'An unknown error occurred.';
		if (err instanceof Error) {
			msg = err.message;
		} else if (typeof err === 'string') {
			msg = err;
		}
		notice.textContent = msg;
		boot.classList.add('failed');
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// Installing Godot's service worker may fix it; reload afterwards.
			let reg;
			try {
				reg = navigator.serviceWorker.getRegistration();
			} catch (err) {
				reg = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				reg.then((r) => (r != null ? Promise.reject(new Error('Service worker already exists.')) : r))
					.then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(resolve, 2000)),
			]).then(() => window.location.reload())
				.catch((err) => console.error('Error while registering service worker:', err));
		} else {
			fail('This browser is missing features the simulation needs:\n' + missing.join('\n')
				+ '\n\nPlease try a recent version of Chrome, Edge or Firefox.');
		}
		return;
	}

	requestAnimationFrame(tick);
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				target = Math.max(target, Math.min(90, (current / total) * 90));
			}
		},
	}).then(() => {
		started = true;
		target = 100;
		text.textContent = 'SIMULATION_ONLINE';
	}, fail);
}());
		</script>
	</body>
</html>
